[project]
name = "cv-analyser"
version = "0.1.0"
description = ""
authors = [{ name = "Samuel Sublate", email = "samuel@asimov.academy" }]
requires-python = "==3.10.*"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "streamlit>=1.37.1,<2",
    "streamlit-aggrid>=1.0.5,<2",
    "pandas>=2.2.2,<3",
    "tinydb>=4.8.0,<5",
    "pydantic>=2.8.2,<3",
    "google-api-python-client>=2.142.0,<3",
    "google-auth-httplib2>=0.2.0,<0.3",
    "google-auth-oauthlib>=1.2.1,<2",
    "langchain-groq>=0.1.9,<0.2",
    "python-dotenv>=1.0.1,<2",
    "pymupdf>=1.24.9,<2",
    "uv>=0.7.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


