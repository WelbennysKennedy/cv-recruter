[project]
name = "cv-analyser"
version = "0.1.0"
description = ""
authors = [
    { name = "Samuel Sublate", email = "samuelsublate.dev@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "streamlit>=1.37.0,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "plotly>=5.23.0,<6.0.0",
    "streamlit-aggrid>=1.0.5,<2.0.0",
    "streamlit-option-menu>=0.3.13,<0.4.0",
    "tinydb>=4.8.0,<5.0.0",
    "pymupdf>=1.24.9,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "streamlit-agraph>=0.0.45,<0.0.46",
    "fastapi>=0.136.1,<0.137.0",
    "python-multipart>=0.0.29,<0.0.30",
]

[project.optional-dependencies]
local = [
    "streamlit>=1.37.0,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "plotly>=5.23.0,<6.0.0",
    "streamlit-aggrid>=1.0.5,<2.0.0",
    "streamlit-option-menu>=0.3.13,<0.4.0",
    "tinydb>=4.8.0,<5.0.0",
    "gspread>=6.1.2,<7.0.0",
    "oauth2client>=4.1.3,<5.0.0",
    "google-api-python-client>=2.140.0,<3.0.0",
    "pyvis>=0.3.2,<0.4.0",
    "streamlit-agraph>=0.0.45,<0.0.46",
]

[tool.poetry]
packages = [
    { include = "analyser" }
]

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.37.0"
pandas = "^2.2.2"
plotly = "^5.23.0"
streamlit-aggrid = "^1.0.5"
streamlit-option-menu = "^0.3.13"
tinydb = "^4.8.0"
pymupdf = "^1.24.9"
python-dotenv = "^1.0.1"
gspread = "^6.1.2"
oauth2client = "^4.1.3"
google-api-python-client = "^2.140.0"
pyvis = "^0.3.2"
streamlit-agraph = "^0.0.45"
fastapi = "^0.136.1"
python-multipart = "^0.0.29"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
